title = "ExoArmur Gitleaks Configuration"

[extend]
useDefault = true

# Exclude generated artifacts, runtime state, validation scripts, and placeholder patterns
[allowlist]
description = "Exclude false positives and generated artifacts"
regexTarget = "line"
paths = [
    # Generated evidence bundles (never committed)
    "artifacts/reality_run_",
    
    # Generated repository metadata (optional but allowed)
    "artifacts/repo_manifest/",
    
    # Runtime state (never committed)
    "data/",
    
    # Runtime logs (never committed)
    "logs/",
    
    # Python virtual environments
    ".venv/",
    "venv/",
    ".venv_clean_install/",
    
    # All scripts with placeholder text (false positives)
    "scripts/",
]
regexes = [
    "REDACTED",
    "key='REDACTED'",
    "fake_api_key",
    "test_key",
    # Deterministic fixture idempotency keys used in proof/test scenarios; not credentials.
    "idempotency_key[\"']?\\s*[:=]\\s*[\"']proof-scenario-001[\"']",
    "idempotency_key[\"']?\\s*[:=]\\s*[\"']idempotency-001[\"']",
]
