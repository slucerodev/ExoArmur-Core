name: V2 Demo Smoke Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  v2-demo-smoke:
    runs-on: ubuntu-latest
    name: V2 Restrained Autonomy Demo Smoke
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade "pip>=26.0"
        python -m pip install pytest pytest-asyncio
        pip install -e .

    - name: Run canonical governance demo (DENY path)
      run: |
        python3 demos/canonical_truth_reconstruction_demo.py > demo_output.txt 2>&1
        cat demo_output.txt

        grep -q "REPLAY_VERDICT=PASS"           demo_output.txt || { echo "❌ Missing REPLAY_VERDICT=PASS";           exit 1; }
        grep -q "CANONICALIZATION_VERSION=v1"   demo_output.txt || { echo "❌ Missing CANONICALIZATION_VERSION=v1";   exit 1; }
        grep -q "HASH_ALGORITHM=sha256"         demo_output.txt || { echo "❌ Missing HASH_ALGORITHM=sha256";         exit 1; }
        grep -q "HASH="                          demo_output.txt || { echo "❌ Missing HASH=";                          exit 1; }

        echo "✅ Demo markers verified"

    - name: Run V2 Demo Tests
      run: |
        python3 -m pytest tests/test_v2_restrained_autonomy.py -v

    - name: Upload demo artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: v2-demo-output
        path: demo_output.txt
        retention-days: 7
