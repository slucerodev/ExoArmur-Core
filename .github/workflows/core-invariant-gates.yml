name: ExoArmur Core Invariant Gates

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  core-invariants:
    runs-on: ubuntu-latest
    name: Core Invariant Gates (Fail-Fast)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12.3
        uses: actions/setup-python@v4
        with:
          python-version: '3.12.3'

      - name: Gate 1 — Install Dependencies
        run: |
          python3 -m pip install --upgrade "pip>=26.0"
          python3 -m pip install -r requirements.lock
          python3 -m pip install --no-deps -e .

      - name: Gate 2 — Test Execution (executor tests)
        run: |
          echo "=== RUNNING EXECUTOR TESTS ==="
          python -m pytest tests/executors/ -v --tb=short

      - name: Gate 3 — Three-run determinism check
        run: |
          echo "=== RUN 1 ==="
          python -m pytest tests/executors/ -q
          echo "=== RUN 2 ==="
          python -m pytest tests/executors/ -q
          echo "=== RUN 3 ==="
          python -m pytest tests/executors/ -q
