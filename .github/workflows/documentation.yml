name: Documentation Build and Deploy

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-docs:
    name: Check Documentation Files
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify core documentation files exist
      run: |
        echo "Checking core documentation files..."
        test -f docs/DOCTRINE.md || { echo "DOCTRINE.md missing"; exit 1; }
        test -f docs/ARCHITECTURE.md || { echo "ARCHITECTURE.md missing"; exit 1; }
        test -f docs/ML_ISOLATION.md || { echo "ML_ISOLATION.md missing"; exit 1; }
        test -f docs/DACT_STANDARD_v0.2.md || { echo "DACT_STANDARD_v0.2.md missing"; exit 1; }
        echo "✅ All core documentation files present"

    - name: Check README links
      run: |
        if [ -f scripts/infra/check_markdown_links.py ]; then
          python scripts/infra/check_markdown_links.py README.md || echo "Link check failed - check manually"
        else
          echo "SKIP: Link check script not found"
        fi